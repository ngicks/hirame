# Test-profile override. The unit itself is the deployed one, byte for byte;
# everything this harness has to change lives here. See deploy/test/README.md.

[Container]
# fanotify filesystem marks need CAP_SYS_ADMIN in the *initial* user namespace,
# which is unavailable at any nesting depth here, so the real daemon cannot
# start -- e2e.sh probes for it first and records the refusal verbatim. This
# image answers the same OverwatchService with the same argv and the same
# deploy/config/overwatch.json: Scan walks the filesystem for real, and
# Subscribe reports a STREAM_START gap, which is exactly the degraded mode the
# D-009 amendment says ingestion falls back to. Everything downstream of it --
# indexer, River, Tika, the database, the API -- stays real.
Image=localhost/hirame-fake-overwatch:latest

# Network=none is kept from the unit: the daemon speaks only over its unix
# socket, and an empty network namespace needs no network backend.
PodmanArgs=--uts=host --cgroups=disabled

# Test-profile override. The unit itself is the deployed one, byte for byte;
# everything this harness has to change lives here. See deploy/test/README.md.
#
[Container]
# Bridge networking cannot come up in the nested environment: netavark shells
# out to iptables, which is not installed, and there is no nft either. Host
# networking is the only backend left, which is also why deploy/test/env/
# addresses every service as 127.0.0.1 rather than by container name.
Network=
Network=host

# --uts=host: sethostname(2) is seccomp-blocked without initial-userns
# CAP_SYS_ADMIN. --cgroups=disabled: /sys/fs/cgroup is read-only here.
PodmanArgs=--uts=host --cgroups=disabled

# Test-profile override. The unit itself is the deployed one, byte for byte;
# everything this harness has to change lives here. See deploy/test/README.md.
#
# Scenario S2 only, and applied on top of dropins/ rather than instead of it.
#
# A third EnvironmentFile= rather than a bogus migration file: the migrations
# are embedded in the image (internal/store/migrate.go, //go:embed), so there is
# no file to corrupt, and re-tagging the image would take the failure out of the
# unit under test. EnvironmentFile= is a list key, so this one is loaded last
# and its DATABASE_URL wins -- and because the URL is unreachable rather than
# malformed, the real database S1 migrated is left exactly as it was.
[Container]
EnvironmentFile=%h/.config/hirame/broken-migration.env

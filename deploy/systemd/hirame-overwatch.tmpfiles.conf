# Install as /etc/tmpfiles.d/hirame-overwatch.conf.
#
# The socket directory overwatch.service also declares as RuntimeDirectory=,
# created early and independently of it. Two reasons it cannot be left to the
# unit alone, both consequences of the container stack being rootless (D-009):
#
#   * indexer.container bind-mounts this path, and a *user* unit cannot order
#     against a *system* unit, so nothing makes the daemon start first.
#   * The rootless podman that would hit a missing bind source cannot create
#     it — /run is root's — so the indexer would fail to start rather than
#     mounting an empty directory, and Restart= would exhaust its start limit
#     within a second and leave the unit failed for good.
#
# systemd-tmpfiles-setup.service runs before basic.target and therefore before
# any lingering user manager, which closes both.
#
# The group on the instance directory is the rootless service user's primary
# group, and it is the load-bearing half: it is what makes the directory
# traversable by a container running User=10001:0, whose gid 0 maps to exactly
# that group. Keep it equal to Group= in overwatch.service.
#
# Only that directory matters. overwatch.service's RuntimeDirectory= adjusts
# ownership and mode to its own User=/Group=/RuntimeDirectoryMode= when it
# starts, so these values govern the window between boot and the daemon's first
# start, and a divergence on the *parent* is harmless either way: 0755 lets
# anyone traverse it, and root:hirame 0750 lets the same group through.

d /run/overwatch        0755 root root   -
d /run/overwatch/hirame 0750 root hirame -

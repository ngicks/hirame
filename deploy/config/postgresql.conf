# Deployment tuning for the ParadeDB PostgreSQL container, mounted read-only at
# /etc/postgresql/postgresql.conf and selected with
# `Exec=postgres -c config_file=...` in postgres.container.
#
# data_directory is deliberately absent: the image exports PGDATA, which is what
# the server falls back to, and hba_file/ident_file then resolve under it. Set
# data_directory here only if you also stop using the image's PGDATA.
#
# postgresql.auto.conf (ALTER SYSTEM) is still read last by PostgreSQL and wins
# over everything below. Nothing in this deployment writes it; if an operator
# does, that is where a surprising effective value will be.

# The image's own file first, so this stays an override layer rather than a
# replacement. It carries two things this deployment must not lose:
#   * shared_preload_libraries = 'pg_search,pg_cron,pg_stat_statements' — the
#     BM25 index (D-012) does not load without it, and the value can only be
#     changed by a restart;
#   * the hardware auto-tune block ParadeDB's 10_bootstrap_paradedb.sh appends
#     at first init (shared_buffers, work_mem, parallel workers). Set PDB_TUNE=
#     false in postgres.container to suppress it and size the pool by hand.
include_if_exists = '/var/lib/postgresql/18/docker/postgresql.conf'

# The container's own interfaces only; the network is internal and carries no
# published port (D-010), so this is reachable from the pod and nowhere else.
listen_addresses = '*'

# River holds a session per worker plus one per job-completion batch, the API
# pool adds its own, and migrations briefly take another. The default 100 is
# adequate for one indexer and one API; raise it together with the
# DATABASE_MAX_CONNS of both binaries rather than on its own.
max_connections = 100

# Extraction writes large text bodies and BM25 index segments in bursts. A
# small WAL forces checkpoints mid-ingest, which is the shape of stall this
# workload produces first.
wal_compression = zstd
min_wal_size = '256MB'
max_wal_size = '4GB'
checkpoint_completion_target = 0.9

# Assumes SSD-backed storage, which is also what go-overwatch's scan budget
# assumes. Raise random_page_cost toward 4 on spinning disks.
random_page_cost = 1.1
effective_io_concurrency = 200

# Slow-query visibility without a statement log. pg_stat_statements is already
# preloaded by the image.
log_min_duration_statement = '1s'
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = '1s'

# Tombstoned documents (D-007) accumulate dead tuples in `documents` and
# `extracted_contents` faster than the defaults expect, and a bloated heap is
# what makes a BM25 rebuild slow.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# River schedules maintenance jobs (D-008) and logs timestamps beside the
# application's; both sides read UTC, so the server should not translate.
timezone = 'UTC'
log_timezone = 'UTC'
